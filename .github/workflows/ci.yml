name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Demo run on sample org
        run: cpq2rca run --source sample --out runs/sample-demo
      - name: Upload demo deliverables
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sample-demo-output
          path: |
            runs/sample-demo/*.docx
            runs/sample-demo/*.xlsx
            runs/sample-demo/analysis.json
